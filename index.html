<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>mmm</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            overflow: hidden;
            margin: 0; /* 기본 8px 여백 때문에 100vh를 넘쳐 화면이 밀리던 문제 수정 */
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        button {
            all: unset;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .container {
            display: flex;
            margin: 0;
            /* 1080px 높이에서 기존 1.5rem과 동일, 화면이 낮아지면 함께 줄어듦 */
            font-size: clamp(1rem, 2.222vh, 1.5rem);
        }

        /* -------- 왼쪽 로고 -------- */
        .box-logo {
            position: relative;
            width: 15%;
            height: 100vh;
            background-color: #BF1122;
            box-shadow: 0 0 0 2px #BF1122;
        }
        #logo {
            cursor: pointer;
        }

        /* -------- 옵션 영역 -------- */
        .box-custom-options {
            position: relative;
            width: 15%;
            height: 100vh;
            background-color: #E6E6E6;
            box-shadow: 0 0 0 2px #BF1122;
            z-index: 10;
            overflow-y: auto;      /* 낮은 화면에서 옵션이 잘리지 않도록 */
            scrollbar-width: none;
        }
        .box-custom-options::-webkit-scrollbar { display: none; }

        .option-head {
            display: inline-flex;
            width: 100%;
            color: #FFFFFF;
            box-sizing: border-box;
        }

        /* 왼쪽 제목 */
        .title {
            flex: 0 0 60%;
            padding-left: 8px;
            padding-top: 2px;
            padding-bottom: 2px;
            background-color: #BF1122;
            box-shadow: 0 0 0 2px #BF1122;
            box-sizing: border-box;
        }

        /* 오른쪽 색상칸 */
        .color-swatch {
            flex: 0 0 40%;
            box-shadow: 0 0 0 2px #BF1122;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* 컬러 팔레트 */
        #color-palette {
            position: absolute;
            z-index: 9999;
            padding: 0px;
            background: #fff;
            box-shadow: 0 0 0 2px #BF1122;
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 0px;
        }
        #color-palette[hidden] { display: none; }
        #color-palette button {
            width: 60px;
            height: 50px;
            border: none;
            cursor: pointer;
        }

        /* 각 옵션 */
        .options {
            background-color: #E6E6E6;
            color: #BF1122;
            padding-left: 8px;
            padding-top: 6px;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .opt {
            display: block;
            cursor: pointer;
            user-select: none;
        }
        @media (hover: hover) {
            .opt:hover { background: #dcdcdc; }
        }
        .opt.active { font-weight: 600; }

        /* -------- 미리보기 -------- */
        .box-preview {
            position: relative;
            width: 50%;
            height: 100vh;
            background-color: #f9f9f9;
            box-shadow: 0 0 0 2px #BF1122;
        }

        .menu-back-forward {
            display: flex;
            width: 100%;
            color: #BF1122;
            border-bottom: 2px solid #BF1122;
            position: relative;
            z-index: 1000;
        }

        #btn-back,
        #btn-forward {
            flex: 1 1 0;
            box-sizing: border-box;
            background-color: #ffffff;
            padding-left: 8px;
            padding-top: 2px;
            padding-bottom: 2px;
            font-size: inherit;
            line-height: 1.2;
            cursor: pointer;
            border: none;
            color: #BF1122;
        }

        @media (hover: hover) {
            #btn-back:hover, #btn-forward:hover {
                background-color: #BF1122;
                color: #FFFFFF;
            }
        }

        #btn-forward {
            border-left: 2px solid #BF1122;
        }

        /* complete! 버튼 */
        .complete-bar {
            display: flex;
            width: 100%;
            position: absolute;
            bottom: 0;
            padding-top: 6px;
            padding-bottom: 16px;
            background-color: #ffffff;
            color: #BF1122;
            box-shadow: 0 0 0 2px #BF1122;
            justify-content: center;
            cursor: pointer;
        }
        @media (hover: hover) {
            .complete-bar:hover {
                background-color: #BF1122;
                color: #FFFFFF;
            }
        }

        /* -------- 오른쪽 아카이브 -------- */
        .box_archive {
            position: relative;
            width: 20%;
            height: 100vh;
            background-color: #f9f9f9;
            box-shadow: 0 0 0 2px #BF1122;
            display: flex;
            flex-direction: column;
        }

        .archive-head {
            padding-left: 8px;
            padding-top: 2px;
            padding-bottom: 2px;
            background-color: #BF1122;
            color: #FFFFFF;
            box-shadow: 0 0 0 2px #BF1122;
            flex: 0 0 auto;
        }

        .archive-list {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px;
        }
        .archive-list img {
            width: 80%;
            display: block;
            margin: 16px auto;
        }

        /* -------- 팝업 -------- */
        .popup {
            position: fixed;
            top: 0;
            right: 0;
            width: 85%;
            height: 100vh;
            display: none;
            z-index: 99999;
            background: url("./svg/popup-bg.svg") no-repeat center;
            background-size: cover;
            align-items: center;
            justify-content: center;
            transform-origin: center;
            animation: popIn 420ms cubic-bezier(.2,1.3,.3,1) both;
        }
        .popup.show { display: flex; }

        .popup-complete-panel {
            position: relative;
            /* 화면 높이가 낮으면 박스가 넘치지 않게 높이 기준으로 제한 */
            width: min(60%, calc((100vh - 60px) * 1.07));
            align-items: center;
            justify-content: center;
        }
        .complete-box {
            width: 98%;
            display: block;
            z-index: 1;
        }
        .popup-snapshot {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: auto;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
        }
        .popup-right-panel {
            width: 30%;
            height: 100vh;
            padding-left: 40px;
            box-sizing: border-box;
        }
        .sticker-on-box { display: none; }
        .sticker {
            display: block;
            margin-top: 9.26vh;           /* 1080px 기준 100px */
            width: min(421px, 100%);
            height: auto;
        }

        .minutes-window {
            box-shadow: 0 0 0 2px #BF1122;
            background: #BF1122;
            color: #fff;
            margin-top: 8.33vh;           /* 1080px 기준 90px */
            margin-left: 10px;
            margin-right: 40px;
        }
        .minutes-title {
            font-weight: 400;
            font-size: clamp(1rem, 1.25vw, 1.5rem);
            padding-left: 12px;
            padding-top: 5px;
            padding-bottom: 1px;
            box-shadow: 0 0 0 2px #BF1122;
        }
        .minutes-value {
            background: #E6E6E6;
            color: #BF1122;
            margin-top: 8px;
            padding: 10px 14px;
            font-weight: 400;
            font-size: clamp(2.4rem, calc((25.5vw - 118px) / 4.5), 5rem);  /* 1920px 기준 5rem, 창 너비에 맞춰 축소 */
            white-space: nowrap;
            letter-spacing: .04em;
            box-shadow: 0 0 0 2px #BF1122;
        }

        /* -------- 버튼 -------- */
        .btn-new {
            margin-top: 9.26vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.1rem, 1.25vw, 1.5rem);
            width: clamp(104px, 7.3vw, 140px);
            height: clamp(104px, 7.3vw, 140px);
            box-sizing: border-box;
            border-radius: 999px;
            background: #E6E6E6;
            color: #BF1122;
            border: 2px solid #BF1122;
            font-weight: 400;
            text-align: center;
            line-height: 120%;
        }
        @media (hover: hover) {
            .btn-new:hover { background: #BF1122; color: #fff; }
        }

        .close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: hsl(354, 84%, 41%);
        }

        /* -------- 애니메이션 -------- */
        @keyframes popIn {
            0% { transform: scale(.0); opacity: 0; }
            70% { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* -------- 시계 레이어 -------- */
        .layer:not([src]) { display: none; }
        .hand-layer {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 90%;
            height: 90%;
            object-fit: contain;
            transform-origin: 50% 50%;
        }

        /* -------- 색상 힌트 -------- */
        .color-hint {
            position: fixed;
            z-index: 5000;
            pointer-events: none;
            top: 0;
            left: 0;
            animation: floaty 2s ease-in-out infinite;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .color-hint.hidden {
            opacity: 0;
            pointer-events: none;
        }
        @keyframes floaty {
            0% { transform: translateY(8px); }
            50% { transform: translateY(0px); }
            100% { transform: translateY(8px); }
        }
        .color-hint img {
            display: block;
            width: 220px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        /* =========================================================
           반응형 — 태블릿 (≤1024px)
           로고 상단 바 / 옵션 + 미리보기 2단 / 아카이브 가로 스트립
           ========================================================= */
        @media (max-width: 1024px) {
            html, body {
                overflow: visible;
                overflow-x: clip;   /* hidden을 쓰면 sticky가 동작하지 않음 */
            }

            .container {
                display: grid;
                grid-template-columns: minmax(230px, 34%) 1fr;
                grid-template-areas:
                    "logo    logo"
                    "options preview"
                    "archive archive";
                grid-template-rows: auto auto 1fr;
                font-size: 1.25rem;
                min-height: 100vh;
                min-height: 100dvh;
            }

            .box-logo,
            .box-custom-options,
            .box-preview,
            .box_archive {
                width: auto;
                height: auto;
            }

            /* 로고 */
            .box-logo {
                grid-area: logo;
                display: flex;
                align-items: center;
                padding: 12px 16px;
                z-index: 11;
            }
            #logo {
                width: 170px !important;
                padding: 0 !important;
                display: block;
            }

            /* 옵션 */
            .box-custom-options {
                grid-area: options;
                overflow: visible;
            }
            .options { padding-bottom: 22px; }
            .opt { padding: 2px 0; }

            /* 미리보기: 정사각형 스테이지 */
            .box-preview {
                grid-area: preview;
                display: flex;
                flex-direction: column;
            }
            .stage-wrap {
                flex: 1 1 auto;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .stage {
                position: relative;
                width: 100%;
                max-width: 560px;
                aspect-ratio: 1 / 1;
            }
            .complete-bar {
                position: relative;
                box-sizing: border-box;
                padding-top: 10px;
                padding-bottom: 14px;
            }

            /* 아카이브: 가로 스크롤 */
            .box_archive {
                grid-area: archive;
                min-height: 0;
            }
            .archive-list {
                display: flex;
                flex-direction: row;
                gap: 12px;
                overflow-x: auto;
                overflow-y: hidden;
                min-height: 120px;
                padding: 14px 12px;
                -webkit-overflow-scrolling: touch;
            }
            .archive-list img {
                flex: 0 0 auto;
                width: 120px !important;
                height: 120px;
                object-fit: contain;
                margin: 0 !important;
            }

            /* 팝업: 세로 배치 + 스크롤
               PC 레이아웃이 끝나는 1024px부터 스티커가 시계 박스 모서리에 붙음 */
            .popup {
                /* 시계 박스 폭: 화면 너비·높이 모두에 맞춰 조절 */
                --boxw: min(78vw, 560px, calc(50svh * 1.07));
                width: 100%;
                height: 100%;
                flex-direction: column;
                justify-content: flex-start;
                overflow-y: auto;
                /* 박스 위로 튀어나오는 스티커 높이만큼 위 여백 확보 */
                padding: calc(var(--boxw) * 0.2 + 16px) 0 40px;
                box-sizing: border-box;
                -webkit-overflow-scrolling: touch;
            }
            .popup-complete-panel {
                flex: 0 0 auto;
                width: var(--boxw);
            }
            .complete-box { width: 100%; }
            .popup-right-panel {
                flex: 0 0 auto;
                width: var(--boxw);
                height: auto;
                padding: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .sticker { display: none; }
            .sticker-on-box {
                display: block;
                position: absolute;
                z-index: 3;
                width: 64%;
                height: auto;
                top: -21%;
                right: -6%;
                transform: rotate(4deg);
                filter: drop-shadow(0 3px 6px rgba(0,0,0,0.12));
                pointer-events: none;
            }
            .minutes-window {
                width: 82%;
                align-self: center;
                margin: 24px 0 0;
            }
            .minutes-title {
                font-size: clamp(0.9rem, 2.2vw, 1.15rem);
                padding: 3px 10px 2px;
            }
            .minutes-value {
                font-size: clamp(1.6rem, 5.2vw, 2.8rem);
                text-align: center;
                margin-top: 4px;
                padding: 4px 10px;
            }
            .btn-new {
                margin-top: 24px;
                width: 116px;
                height: 116px;
                font-size: 1.2rem;
            }
        }

        /* =========================================================
           반응형 — 모바일 (≤640px)
           미리보기를 상단에 고정(sticky)해 옵션을 고르면서 시계를 볼 수 있게
           ========================================================= */
        @media (max-width: 640px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "logo"
                    "preview"
                    "options"
                    "archive";
                grid-template-rows: auto auto auto 1fr;
                font-size: 1.1rem;
                padding-bottom: calc(56px + env(safe-area-inset-bottom));
            }

            .box-logo { padding: 10px 14px; }
            #logo { width: 128px !important; }

            /* 시계 미리보기 상단 고정 */
            .box-preview {
                position: sticky;
                top: 0;
                z-index: 20;
            }
            #btn-back, #btn-forward {
                padding-top: 6px;
                padding-bottom: 6px;
            }
            .stage-wrap { padding: 12px; }
            .stage {
                width: min(100%, 40vh);
                width: min(100%, 40svh);
            }

            /* complete! 버튼은 화면 하단 고정 */
            .complete-bar {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                width: auto;
                z-index: 30;
                padding-top: 12px;
                padding-bottom: calc(14px + env(safe-area-inset-bottom));
            }

            /* 옵션: 가로로 흐르게 해서 세로 길이 줄이기 */
            .box-custom-options { z-index: 10; }
            .title { padding-top: 6px; padding-bottom: 6px; }
            .options {
                flex-direction: row;
                flex-wrap: wrap;
                column-gap: 18px;
                row-gap: 2px;
                padding: 10px 12px 18px;
            }
            .opt { padding: 6px 0; }   /* 터치 영역 확보 */

            /* 팔레트 */
            #color-palette { grid-template-columns: repeat(5, 56px); }
            #color-palette button { width: 56px; height: 48px; }

            .archive-list img {
                width: 96px !important;
                height: 96px;
            }

            /* 힌트 */
            .color-hint img { width: 150px; }

            /* 팝업: 박스를 조금 더 크게, 높이 기준 제한은 더 타이트하게
               (minutes + create new!까지 스크롤 없이 한 화면에) */
            .popup {
                --boxw: min(84vw, calc(44svh * 1.07));
                padding: max(72px, 10.5svh) 0 20px;
            }
            .minutes-window { margin-top: 20px; }
            .minutes-value { font-size: clamp(1.6rem, 7.5vw, 2rem); }
            .btn-new {
                margin-top: 20px;
                width: 100px;
                height: 100px;
                font-size: 1.1rem;
            }
        }

    </style>
</head>

<body>
  
<div class="container">
    <header class="box-logo">
        <img id="logo" src="./svg/logo.svg" style="width: 80%; padding: 16px">
    </header>

    <aside class="box-custom-options">
        <nav class="group" data-group="dial">
            <div class="option-head">
                <div class="title">dials</div>
                <div class="color-swatch"></div>
            </div>
            <div class="options">
                <span class="opt" data-value="circle">circle</span>
                <span class="opt" data-value="square">square</span>
                <span class="opt" data-value="house">house</span>
                <span class="opt" data-value="convex square">convex square</span>
            </div>
        </nav>
        <nav class="group" data-group="numerals">
            <div class="option-head">
                <div class="title">numerals</div>
                <div class="color-swatch"></div>
            </div>
            <div class="options">
                <span class="opt" data-value="numbers">numbers</span>
                <span class="opt" data-value="two dots">two dots</span>
                <span class="opt" data-value="small dots">small dots</span>
                <span class="opt" data-value="big dots">big dots</span>
                <span class="opt" data-value="small sectors">small sectors</span>
                <span class="opt" data-value="big sectors">big sectors</span>
                <span class="opt" data-value="small squares">small squares</span>
                <span class="opt" data-value="big squares">big squares</span>
            </div>
        </nav>
        <nav class="group" data-group="marks">
            <div class="option-head">
                <div class="title">marks</div>
                <div class="color-swatch"></div>
            </div>
            <div class="options">
                <span class="opt" data-value="line">line</span>
                <span class="opt" data-value="small dots">small dots</span>
                <span class="opt" data-value="big dots">big dots</span>
            </div>
        </nav>
        <nav class="group" data-group="hands">
            <div class="option-head">
                <div class="title">hands</div>
                <div class="color-swatch"></div>
            </div>
            <div class="options">
                <span class="opt" data-value="circle">circle</span>
                <span class="opt" data-value="square">square</span>
                <span class="opt" data-value="straight">straight</span>
                <span class="opt" data-value="arrow">arrow</span>
            </div>
        </nav>
    </aside>

    <main class="box-preview">
        <div class="menu-back-forward">
            <button id="btn-back" title="뒤로가기">↩︎ back</button>
            <button id="btn-forward" title="앞으로가기">↪︎ forward</button>
        </div>  
        <div class="stage-wrap">
            <div class="stage" id="stage">
                <!-- 시계 레이어 -->
                <img id="L-dial" class="layer" alt="dial layer" />
                <img id="L-numerals" class="layer" alt="numerals layer" />
                <img id="L-marks" class="layer" alt="marks layer" />

                <!-- hands를 세 장으로 쪼갠 버전 -->
                <img id="L-hour"   class="layer hand-layer" alt="hour hand layer" />
                <img id="L-minute" class="layer hand-layer" alt="minute hand layer" />
                <img id="L-second" class="layer hand-layer" alt="second hand layer" />
            </div>
        </div>
        <div class="complete-bar" id="btn-complete">
            <button class="complete-btn">complete!</button>
        </div>
    </main>

    <aside class="box_archive">
        <div class="archive-head" aria-hidden="true">&nbsp;archive preview</div>
        <div class="archive-list" id="archiveList"></div>
    </aside>

</div>

<div id="color-palette" hidden>
  <button data-color="#C41224"></button>
  <button data-color="#EF4B3E"></button>
  <button data-color="#7ED0FF"></button>
  <button data-color="#D8F2C9"></button>
  <button data-color="#E4B5F1"></button>
  <button data-color="#5A1E22"></button>
  <button data-color="#E2C7CF"></button>
  <button data-color="#F7F0A4"></button>
  <button data-color="#FFFFFF"></button>
  <button data-color="#EBEBEB"></button>
</div>

<div id="popup" class="popup">
    <div class="popup-complete-panel">
      <img src="./svg/complete _box.svg" class="complete-box">
      <img id="popupSnapshot" class="popup-snapshot" alt="">
      <!-- 모바일 전용: 시계 박스 모서리에 붙는 스티커 -->
      <img src="./svg/sticker.svg" class="sticker-on-box" alt="" aria-hidden="true">
    </div>

    <div class="popup-right-panel">
      <img src="./svg/sticker.svg" class="sticker">
      <div class="minutes-window">
        <div class="minutes-title">your minutes are…</div>
        <div id="minutesNow" class="minutes-value">00:00:00</div>
      </div>
      <button id="btn-create-new" class="btn-new">create<br>new!</button>
    </div>
</div>

<div id="color-hint" class="color-hint">
  <img src="./svg/color-hint.svg" alt="try changing the colors!">
</div>

<audio id="tick-sound" src="audio/clock.mp3" loop></audio>

</body>

<script>
const audioEl = document.getElementById('tick-sound');

  // 1) 페이지 로드되면 한 번 재생 시도
  window.addEventListener('load', () => {
    if (!audioEl) return;
    // controls 안보이게
    audioEl.style.display = 'none';

    // 자동재생 시도
    audioEl.play().catch(() => {
      // 여기로 오면 브라우저가 막은 것
      // 다음 사용자 입력 때 다시 시도하도록 설정
      const tryPlayOnce = () => {
        audioEl.play().catch(()=>{});  // 한 번 더 시도
        document.removeEventListener('click', tryPlayOnce);
      };
      document.addEventListener('click', tryPlayOnce, { once: true });
    });
  });

/* ============ 상태/DOM ============ */
const groups = ['dial','numerals','marks','hands'];
const stageEl = document.getElementById('stage');
const archiveList = document.getElementById('archiveList');
const palette = document.getElementById('color-palette');

const imgEls = {
  dial:     document.getElementById('L-dial'),
  numerals: document.getElementById('L-numerals'),
  marks:    document.getElementById('L-marks'),

  hour:     document.getElementById('L-hour'),
  minute:   document.getElementById('L-minute'),
  second:   document.getElementById('L-second'),
};

const defaultColors = {
  dial: '#7ED0FF',
  numerals: '#F7F0A4',
  marks: '#D3F4C9',
  hands: '#5F272C'
};

let state = {
  dial:      { shape:null, color: defaultColors.dial },
  numerals:  { shape:null, color: defaultColors.numerals },
  marks:     { shape:null, color: defaultColors.marks },
  hands:     { shape:null, color: defaultColors.hands }
};

/* 힌트 풍선 관련 */
const hintEl = document.getElementById('color-hint');
let hintDismissed = false;

/* 💡 inactivity 타이머 관련 */
let inactivityTimer = null;
const INACTIVITY_MS = 5000; // 7초

function showHint() {
  if (!hintEl) return;
  // 위치 다시 맞춰주고
  positionHintToNumerals();
  // 다시 보이게 (opacity 1로 페이드인)
  hintEl.classList.remove('hidden');
  hintDismissed = false;
}

function hideHint() {
  if (!hintEl) return;
  hintEl.classList.add('hidden');
  hintDismissed = true;
}

function resetInactivityTimer() {
  // 타이머 초기화하고 다시 5초 셋업
  if (inactivityTimer) {
    clearTimeout(inactivityTimer);
  }
  inactivityTimer = setTimeout(() => {
    // 5초 동안 아무 interaction 없으면 힌트 다시 등장
    showHint();
  }, INACTIVITY_MS);
}

/* 전역 클릭 감지해서 타이머 리셋 */
document.addEventListener('click', () => {
  resetInactivityTimer();
});

/* ============ 파일명 매핑(예외 보정) ============ */
const OVERRIDE = {
  numerals: {
    'numbers': 'numbers',
    'big squares': 'big squares'
  }
};

function filePath(group, value){
  const mapped = (OVERRIDE[group] && OVERRIDE[group][value]) ? OVERRIDE[group][value] : value;
  return `./svg/${group}_${mapped}.svg`;
}

/* ============ 히스토리(뒤/앞) ============ */
const history = [];
let histIndex = -1;

function pushHistory(){
  history.splice(histIndex+1);
  history.push(JSON.parse(JSON.stringify(state)));
  histIndex = history.length - 1;
  updateNavButtons();
}
function restoreFromHistory(i){
  if(i<0 || i>=history.length) return;
  state = JSON.parse(JSON.stringify(history[i]));
  histIndex = i;
  applyStateToUI();
  updateNavButtons();
}
function updateNavButtons(){
  const b = document.getElementById('btn-back');
  const f = document.getElementById('btn-forward');
  if (b) b.style.opacity = (histIndex>0)?1:0.4;
  if (f) f.style.opacity = (histIndex<history.length-1)?1:0.4;
}

/* ============ SVG 색 적용 ============ */
/* 시계 레이어 SVG는 HTML 안에 내장(EMBEDDED_SVGS)되어 있어서
   파일로 직접 열거나(file://) 어떤 호스팅에서도 fetch 없이 색을 입힐 수 있음.
   결과는 data: URL이라 canvas 스냅샷도 막히지 않음. */
async function colorizeSVGToURL(url, color){
  let text = (window.EMBEDDED_SVGS || {})[url];
  if (text == null) {
    try {
      const res = await fetch(url);
      text = await res.text();
    } catch(e) {
      console.warn('fetch/colorize 실패 → 원본 경로 사용:', url, e);
      return url;
    }
  }
  const styled = text.replace(
    /<svg([^>]*)>/i,
    (m,attrs)=>`<svg${attrs}><style>*{fill:${color};stroke:${color};}</style>`
  );
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(styled);
}

/* ============ dial / numerals / marks 반영 ============ */
async function applyLayer(group){
  const {shape, color} = state[group];
  const img = imgEls[group];
  if(!img) return;
  if(!shape){ 
    img.removeAttribute('src'); 
    return; 
  }

  const src = filePath(group, shape);
  const coloredURL = await colorizeSVGToURL(src, color);
  img.src = coloredURL;

  let size = 90;
  if (group === 'numerals' && state.dial.shape === 'house') {
    size = 90 * 0.9; // 81
  }

  const offset = (100 - size) / 2;

  img.style.width = `${size}%`;
  img.style.height = `${size}%`;
  img.style.objectFit = 'contain';
  img.style.position = 'absolute';
  img.style.left = `${offset}%`;
  img.style.top = `${offset}%`;
}

/* ============ hands 세 장 반영 ============ */
async function applyHandsLayer() {
  const { shape, color } = state.hands;

  if (!shape) {
    imgEls.hour.removeAttribute('src');
    imgEls.minute.removeAttribute('src');
    imgEls.second.removeAttribute('src');
    return;
  }

  const hourPath   = `./svg/hands_${shape}_hour.svg`;
  const minutePath = `./svg/hands_${shape}_minute.svg`;
  const secondPath = `./svg/hands_second.svg`;

  const hourURL   = await colorizeSVGToURL(hourPath,   color);
  const minuteURL = await colorizeSVGToURL(minutePath, color);
  const secondURL = await colorizeSVGToURL(secondPath, color);

  imgEls.hour.src   = hourURL;
  imgEls.minute.src = minuteURL;
  imgEls.second.src = secondURL;

  [imgEls.hour, imgEls.minute, imgEls.second].forEach(img => {
    img.style.width      = `90%`;
    img.style.height     = `90%`;
    img.style.objectFit  = 'contain';
    img.style.position   = 'absolute';
    img.style.left       = `5%`;
    img.style.top        = `5%`;
  });
}

/* ============ 시계 바늘 회전 ============ */
function updateHandRotation() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  const hourDeg   = ((h % 12) + m/60 + s/3600) * 30;
  const minuteDeg = (m + s/60) * 6;
  const secondDeg = s * 6;

  if (imgEls.hour) {
    imgEls.hour.style.transform   = `rotate(${hourDeg}deg)`;
  }
  if (imgEls.minute) {
    imgEls.minute.style.transform = `rotate(${minuteDeg}deg)`;
  }
  if (imgEls.second) {
    imgEls.second.style.transform = `rotate(${secondDeg}deg)`;
  }
}

/* ============ 전체 state → 화면 반영 ============ */
function applyStateToUI(){
  document.querySelectorAll('.group').forEach(g=>{
    const group = g.dataset.group;
    const sel = state[group].shape;
    g.querySelectorAll('.opt').forEach(o=>{
      o.classList.toggle('active', o.dataset.value === sel);
    });
    const sw = g.querySelector('.color-swatch');
    if(sw) sw.style.backgroundColor = state[group].color;
  });

  ['dial','numerals','marks'].forEach(applyLayer);

  applyHandsLayer();
  updateHandRotation();
}

/* ============ 옵션(도형) 클릭 ============ */
document.querySelectorAll('.group .opt').forEach(opt=>{
  opt.addEventListener('click', async (e)=>{
    state[e.currentTarget.closest('.group').dataset.group].shape = e.currentTarget.dataset.value;

    const wrap = e.currentTarget.parentElement;
    wrap.querySelectorAll('.opt').forEach(el=>el.classList.remove('active'));
    e.currentTarget.classList.add('active');

    if (e.currentTarget.closest('.group').dataset.group === 'hands') {
      await applyHandsLayer();
    } else {
      await applyLayer(e.currentTarget.closest('.group').dataset.group);
    }

    updateHandRotation();
    pushHistory();
  });
});

/* ============ 힌트 위치 numerals 우측에 붙이기 ============ */
function positionHintToNumerals() {
  if (!hintEl) return;

  const numeralsSwatch = document.querySelector('.group[data-group="numerals"] .color-swatch');
  if (!numeralsSwatch) return;

  const rect = numeralsSwatch.getBoundingClientRect();
  const offsetX = 8;
  const offsetY = -10;
  const hintW = hintEl.offsetWidth || 220;

  let left = rect.right + offsetX;
  let top  = rect.top   + offsetY;

  // 오른쪽 공간이 부족하면(태블릿/모바일) 스와치 아래쪽에 배치
  if (left + hintW > window.innerWidth - 8) {
    left = Math.max(8, Math.min(rect.left + rect.width * 0.2, window.innerWidth - hintW - 8));
    top  = rect.bottom + 4;
  }

  hintEl.style.left = left + 'px';
  hintEl.style.top  = top  + 'px';

  // 스크롤로 스와치가 화면 밖에 있거나 고정된 미리보기 뒤에 가려지면 숨김
  const preview = document.querySelector('.box-preview');
  let minTop = 0;
  if (preview && getComputedStyle(preview).position === 'sticky') {
    minTop = preview.getBoundingClientRect().bottom;
  }
  const offscreen = rect.top < minTop || rect.bottom > window.innerHeight;
  hintEl.style.visibility = offscreen ? 'hidden' : '';
}

/* ============ 팔레트(컬러 변경) ============ */
let currentSwatch = null;
let currentGroup = null;

document.querySelectorAll('.group .color-swatch').forEach(swatch=>{
  swatch.addEventListener('click',(e)=>{
    const clickedSwatch = e.currentTarget;
    const group = clickedSwatch.closest('.group').dataset.group;

    // 이미 같은 스와치를 눌렀고 팔레트가 열려있으면 → 닫기
    if (!palette.hidden && currentSwatch === clickedSwatch) {
      palette.hidden = true;
      currentSwatch = null;
      currentGroup = null;
      // 힌트는 여기서 따로 안 만짐
      return;
    }

    currentSwatch = clickedSwatch;
    currentGroup  = group;

    const rect = currentSwatch.getBoundingClientRect();
    palette.hidden = false;
    // 팔레트가 화면 오른쪽 밖으로 나가지 않게 보정
    const pw = palette.offsetWidth;
    const left = Math.max(4, Math.min(rect.left, window.innerWidth - pw - 4));
    palette.style.left = `${left + window.scrollX}px`;
    palette.style.top  = `${rect.bottom + 2 + window.scrollY}px`;

    // 힌트는 클릭 시 사라지고 (=hideHint),
    // 그리고 inactivity 타이머 재시작
    hideHint();
    resetInactivityTimer();
  });
});

/* 팔레트에서 색 버튼 클릭 -> 실제 색 반영 */
palette.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-color]');
  if(!btn) return;

  const color = btn.dataset.color;
  if (currentGroup) {
    state[currentGroup].color = color;

    if (currentSwatch) {
      currentSwatch.style.backgroundColor = color;
    }

    if (currentGroup === 'hands') {
      await applyHandsLayer();
    } else {
      await applyLayer(currentGroup);
    }

    updateHandRotation();
    pushHistory();
  }

  palette.hidden = true;
  currentSwatch = null; 
  currentGroup = null;

  // 색 찍고 나서도 다시 5초 기다렸다가 힌트 뜰 수 있게
  resetInactivityTimer();
});

/* 팔레트 외부 클릭 시 팔레트 닫기 */
document.addEventListener('click',(e)=>{
  const clickedSwatch = e.target.classList && e.target.classList.contains('color-swatch');
  if(!palette.hidden && !palette.contains(e.target) && !clickedSwatch){
    palette.hidden = true;
    currentSwatch = null; 
    currentGroup = null;
  }
});

/* ============ 뒤/앞 버튼 ============ */
const backBtn = document.getElementById('btn-back');
const fwdBtn  = document.getElementById('btn-forward');

backBtn && backBtn.addEventListener('click', ()=>{
  if(histIndex>0) restoreFromHistory(histIndex-1);
});

fwdBtn && fwdBtn.addEventListener('click', ()=>{
  if(histIndex<history.length-1) restoreFromHistory(histIndex+1);
});

/* ============ 스냅샷 합성 (complete용) ============ */
async function composeSnapshotDataURL() {
  const size = 1000;
  const canvas = document.createElement('canvas');
  canvas.width = size; 
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const drawList = [
    imgEls.dial,
    imgEls.numerals,
    imgEls.marks,
    imgEls.hour,
    imgEls.minute,
    imgEls.second,
  ];

  for (const img of drawList) {
    if (!img || !img.src) continue;
    if (!img.complete) {
      await new Promise(r => {
        img.addEventListener('load', r, { once:true });
        img.addEventListener('error', r, { once:true });
      });
    }
    if (!img.naturalWidth) continue;   // 깨진 이미지는 건너뛰기
    ctx.save();

    const match = img.style.transform && img.style.transform.match(/rotate\(([-0-9.]+)deg\)/);
    if (match) {
      const deg = parseFloat(match[1]);
      const rad = deg * Math.PI/180;

      const boxX = 0.05 * size;
      const boxY = 0.05 * size;
      const boxW = 0.90 * size;
      const boxH = 0.90 * size;

      const cx = boxX + boxW/2;
      const cy = boxY + boxH/2;

      ctx.translate(cx, cy);
      ctx.rotate(rad);
      ctx.translate(-cx, -cy);

      ctx.drawImage(img, boxX, boxY, boxW, boxH);
    } else {
      ctx.drawImage(img, 0, 0, size, size);
    }

    ctx.restore();
  }

  return canvas.toDataURL('image/png');
}

/* ============ 팝업 관련 (complete!) ============ */
const popup         = document.getElementById('popup');
const minutesNowEl  = document.getElementById('minutesNow');
const createNewBtn  = document.getElementById('btn-create-new');
const logo          = document.getElementById('logo');
const closeBtn      = document.querySelector('#popup .close');
let pendingSnapshot = null;

function pad(n){ return String(n).padStart(2,'0'); }
function nowHHMMSS(){
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

/* complete! 버튼 -> 팝업 띄우기 */
document.getElementById('btn-complete').addEventListener('click', async ()=>{
  // 스냅샷이 실패해도 팝업은 반드시 뜨도록
  try {
    pendingSnapshot = await composeSnapshotDataURL();
  } catch (e) {
    console.warn('스냅샷 생성 실패:', e);
    pendingSnapshot = null;
  }

  const snapshotEl = document.getElementById('popupSnapshot');
  if (snapshotEl && pendingSnapshot) {
    snapshotEl.src = pendingSnapshot;
  }

  if (minutesNowEl) minutesNowEl.textContent = nowHHMMSS();

  if (popup) popup.classList.add('show');
});

/* 팝업의 create new! -> 아카이브 prepend + 초기화 + 팝업 닫기 */
createNewBtn && createNewBtn.addEventListener('click', ()=>{
  if (pendingSnapshot) {
    const thumb = new Image();
    thumb.src = pendingSnapshot;
    thumb.style.width = '80%';
    thumb.style.display = 'block';
    thumb.style.margin = '16px auto';

    if (archiveList.firstChild) {
      archiveList.insertBefore(thumb, archiveList.firstChild);
    } else {
      archiveList.appendChild(thumb);
    }
  }

  state.dial.shape      = null;
  state.numerals.shape  = null;
  state.marks.shape     = null;
  state.hands.shape     = null;

  imgEls.dial.removeAttribute('src');
  imgEls.numerals.removeAttribute('src');
  imgEls.marks.removeAttribute('src');
  imgEls.hour.removeAttribute('src');
  imgEls.minute.removeAttribute('src');
  imgEls.second.removeAttribute('src');

  document.querySelectorAll('.group .opt').forEach(o=>o.classList.remove('active'));

  pushHistory();

  pendingSnapshot = null;
  popup && popup.classList.remove('show');
});

/* 로고 클릭해도 팝업 닫히게 */
logo && logo.addEventListener('click', () => {
  popup && popup.classList.remove('show');
});

/* 팝업 닫기(X) / 바깥 클릭 */
closeBtn && closeBtn.addEventListener('click', ()=> popup && popup.classList.remove('show'));
popup && popup.addEventListener('click', (e)=>{
  if (e.target === popup) popup.classList.remove('show');
});

/* ============ 초기 세팅 ============ */
(function init(){
  groups.forEach(g=>{
    const sw = document.querySelector(`.group[data-group="${g}"] .color-swatch`);
    if(sw) sw.style.backgroundColor = state[g].color;
  });

  document.querySelectorAll('#color-palette button[data-color]').forEach(btn=>{
    btn.style.backgroundColor = btn.dataset.color;
    btn.title = btn.dataset.color;
  });

  pushHistory();

  positionHintToNumerals();

  updateHandRotation();

  resetInactivityTimer();
})();

/* 창 크기 바뀔 때마다 힌트 위치 갱신 */
window.addEventListener('resize', positionHintToNumerals);
/* 스크롤할 때도 힌트 위치 갱신 (모바일/태블릿, 낮은 화면의 옵션 스크롤) */
window.addEventListener('scroll', positionHintToNumerals, { passive: true });
document.querySelector('.box-custom-options')
  .addEventListener('scroll', positionHintToNumerals, { passive: true });
/* 화면 가로 크기가 바뀌면(회전 등) 열려 있던 팔레트는 닫기
   (모바일 주소창이 접힐 때 생기는 세로 resize에는 반응하지 않음) */
let lastVW = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastVW) return;
  lastVW = window.innerWidth;
  palette.hidden = true;
  currentSwatch = null;
  currentGroup = null;
});

/* 매초마다 바늘 회전 업데이트 */
setInterval(updateHandRotation, 1000);

</script>
